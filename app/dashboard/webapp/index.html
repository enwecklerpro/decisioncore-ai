<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>DecisionCore AI - Dashboard</title>
    <script id="sap-ui-bootstrap" src="https://sapui5.hana.ondemand.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon" data-sap-ui-compatVersion="edge" data-sap-ui-async="true"
        data-sap-ui-frameOptions="allow" data-sap-ui-resourceroots='{"decisioncore.dashboard": "./"}'
        data-sap-ui-xx-componentPreload="off" data-sap-ui-oninit="module:sap/ui/core/ComponentSupport">
        </script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .dashboardCard {
            margin: 8px;
            border-radius: 16px !important;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15) !important;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
        }

        .dashboardCard:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2) !important;
        }

        .kpiCard {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9ff 100%);
            border-left: 4px solid #0a6ed1;
        }

        .kpiCard.success {
            border-left-color: #107e3e;
        }

        .kpiCard.warning {
            border-left-color: #df6e0c;
        }

        .kpiCard.info {
            border-left-color: #0a6ed1;
        }

        .kpiValue {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #0a6ed1, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .kpiLabel {
            color: #666;
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chartContainer {
            min-height: 180px;
            padding: 20px;
            background: linear-gradient(180deg, #ffffff 0%, #f5f7ff 100%);
        }

        .headerGradient {
            background: linear-gradient(135deg, #0a6ed1 0%, #764ba2 100%) !important;
        }

        .sapMPageHeader {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        }

        .statCircle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin: 10px auto;
        }

        .statCircle.approved {
            background: linear-gradient(135deg, #107e3e, #1a9e4d);
        }

        .statCircle.rejected {
            background: linear-gradient(135deg, #bb0000, #dc3545);
        }

        .statCircle.review {
            background: linear-gradient(135deg, #df6e0c, #fd7e14);
        }

        .sapFCard {
            border-radius: 16px !important;
        }

        .sapMBar {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(10px);
        }

        .footerBar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        }

        .footerBar .sapMText {
            color: white !important;
        }

        .rulesTable {
            border-radius: 12px;
            overflow: hidden;
        }

        .rulesTable .sapMListTblHeader {
            background: linear-gradient(135deg, #0a6ed1 0%, #764ba2 100%);
        }

        .rulesTable .sapMListTblHeader .sapMText {
            color: white !important;
            font-weight: 600;
        }
    </style>
</head>

<body class="sapUiBody">
    <div data-sap-ui-component data-name="decisioncore.dashboard" data-id="container"></div>
</body>

</html>
