<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>DecisionCore AI - Launchpad</title>
    <script id="sap-ui-bootstrap" src="https://sapui5.hana.ondemand.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon" data-sap-ui-libs="sap.m, sap.f, sap.ui.layout" data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true">
        </script>
    <script>
        sap.ui.getCore().attachInit(function () {
            sap.ui.require(["sap/ui/core/mvc/XMLView", "sap/m/Shell"], function (XMLView, Shell) {
                var sView = `
                <mvc:View xmlns:mvc="sap.ui.core.mvc" xmlns="sap.m" xmlns:f="sap.f" xmlns:grid="sap.ui.layout.cssgrid" displayBlock="true">
                    <Shell appWidthLimited="false">
                        <App>
                            <Page showHeader="false">
                                <f:ShellBar title="DecisionCore AI" secondTitle="Enterprise Platform" homeIcon="sap-icon://decision" showNotifications="true" notificationsNumber="2">
                                    <f:profile>
                                        <Avatar initials="EP"/>
                                    </f:profile>
                                </f:ShellBar>
                                <f:GridContainer snapToRow="true" class="sapUiSmallMargin">
                                    <f:layout>
                                        <grid:GridBoxLayout boxMinWidth="17rem"/>
                                    </f:layout>
                                    
                                    <!-- TILES -->
                                    <GenericTile header="Total Decisions" subheader="All time" press="onPressDashboard" class="sapUiTinyMargin">
                                        <TileContent>
                                            <NumericContent value="12.5k" icon="sap-icon://line-charts" valueColor="Good"/>
                                        </TileContent>
                                    </GenericTile>

                                    <GenericTile header="Approval Rate" subheader="Automation" press="onPressDashboard" class="sapUiTinyMargin">
                                        <TileContent>
                                            <NumericContent value="68" scale="%" icon="sap-icon://accept" valueColor="Good"/>
                                        </TileContent>
                                    </GenericTile>

                                    <GenericTile header="Executive Dashboard" subheader="Analytics" press="onPressDashboard" class="sapUiTinyMargin">
                                        <TileContent>
                                            <ImageContent src="sap-icon://bbyd-dashboard"/>
                                        </TileContent>
                                    </GenericTile>

                                    <GenericTile header="Scenario Management" subheader="Definitions" press="onPressScenarios" class="sapUiTinyMargin">
                                        <TileContent>
                                            <ImageContent src="sap-icon://org-chart"/>
                                        </TileContent>
                                    </GenericTile>

                                    <GenericTile header="Rules Management" subheader="Policies" press="onPressRules" class="sapUiTinyMargin">
                                        <TileContent>
                                            <ImageContent src="sap-icon://user-settings"/>
                                        </TileContent>
                                    </GenericTile>

                                    <GenericTile header="Decision Execution" subheader="Simulation" press="onPressExecute" class="sapUiTinyMargin">
                                        <TileContent>
                                            <ImageContent src="sap-icon://media-play"/>
                                        </TileContent>
                                    </GenericTile>

                                    <GenericTile header="Decision History" subheader="Audit Logs" press="onPressHistory" class="sapUiTinyMargin">
                                        <TileContent>
                                            <ImageContent src="sap-icon://history"/>
                                        </TileContent>
                                    </GenericTile>

                                    <GenericTile header="Administration" subheader="Settings" press="onPressAdmin" class="sapUiTinyMargin">
                                        <TileContent>
                                            <ImageContent src="sap-icon://action-settings"/>
                                        </TileContent>
                                    </GenericTile>

                                </f:GridContainer>
                            </Page>
                        </App>
                    </Shell>
                </mvc:View>`;

                XMLView.create({
                    definition: sView,
                    controller: {
                        onPressDashboard: function () { window.location.href = "/dashboard/webapp/index.html"; },
                        onPressScenarios: function () { window.location.href = "/scenarios/webapp/index.html"; },
                        onPressRules: function () { window.location.href = "/rules/webapp/index.html"; },
                        onPressExecute: function () { window.location.href = "/execute/webapp/index.html"; },
                        onPressHistory: function () { window.location.href = "/history/webapp/index.html"; },
                        onPressAdmin: function () { window.location.href = "/admin/webapp/index.html"; }
                    }
                }).then(function (oView) {
                    oView.placeAt("content");
                });
            });
        });
    </script>
</head>

<body class="sapUiBody" id="content">
</body>

</html>
