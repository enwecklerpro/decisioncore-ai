<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>DecisionCore AI - Enterprise Launchpad</title>
    <script id="sap-ui-bootstrap" src="https://sapui5.hana.ondemand.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon" data-sap-ui-libs="sap.m,sap.f,sap.ui.layout,sap.tnt"
        data-sap-ui-compatVersion="edge" data-sap-ui-async="true" data-sap-ui-preload="async">
        </script>

    <style>
        /* Modern Enterprise Background */
        body,
        #content {
            height: 100%;
            margin: 0;
            background-color: #f5f6f7;
            background-image:
                radial-gradient(at 0% 0%, hsla(210, 100%, 96%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(220, 100%, 96%, 1) 0, transparent 50%);
            font-family: "72", "Ariel", sans-serif;
        }

        /* Hero Section Styling */
        .hero-section {
            padding: 3rem 4rem 2rem 4rem;
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            margin-bottom: 2rem;
        }

        .hero-title .sapMTitle {
            font-size: 2.5rem !important;
            font-weight: 700 !important;
            color: #1d2d3e;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        .hero-subtitle .sapMText {
            font-size: 1.1rem !important;
            font-weight: 300;
            color: #555e68;
        }

        .content-padding {
            padding: 0 4rem;
        }

        .sapMGT:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .sapMGT {
            transition: all 0.3s ease;
            border-radius: 12px !important;
            overflow: hidden !important;
        }
    </style>

    <script>
        sap.ui.getCore().attachInit(function () {
            // Use sap.ui.require to ensure all modules are loaded to prevent "is not a constructor" errors
            sap.ui.require([
                "sap/f/GridContainer",
                "sap/f/GridContainerSettings",
                "sap/f/GridContainerItemLayoutData",
                "sap/m/GenericTile",
                "sap/m/TileContent",
                "sap/m/ImageContent",
                "sap/m/NumericContent",
                "sap/m/Title",
                "sap/m/Text",
                "sap/m/VBox",
                "sap/m/HBox",
                "sap/m/Button",
                "sap/m/Image",
                "sap/m/Avatar",
                "sap/m/Page",
                "sap/m/Bar",
                "sap/m/ToolbarSpacer",
                "sap/tnt/ToolHeader"
            ], function (GridContainer, GridContainerSettings, GridContainerItemLayoutData, GenericTile, TileContent, ImageContent, NumericContent, Title, Text, VBox, HBox, Button, Image, Avatar, Page, Bar, ToolbarSpacer, ToolHeader) {

                // 1. HEADER: Hero Section
                var oHeroLayout = new VBox({
                    items: [
                        new Title({ text: "Good Morning, Taha", level: "H1" }).addStyleClass("hero-title"),
                        new Text({ text: "Here is your decision intelligence overview for today." }).addStyleClass("hero-subtitle")
                    ]
                }).addStyleClass("hero-section");

                // 2. KPIS: Grid Container
                var oGridKPI = new GridContainer({
                    layout: new GridContainerSettings({ rowSize: "84px", columnSize: "84px", gap: "16px" }),
                    layoutXS: new GridContainerSettings({ columns: 2 }),
                    items: [
                        new GenericTile({
                            header: "Decisions Today", subheader: "Live Volume", press: function () { window.location.href = "/dashboard/webapp/index.html"; },
                            tileContent: new TileContent({ content: new NumericContent({ value: "12.5k", icon: "sap-icon://line-chart", valueColor: "Good", indicator: "Up" }) })
                        }).setLayoutData(new GridContainerItemLayoutData({ columns: 2, rows: 2 })),

                        new GenericTile({
                            header: "Approval Rate", subheader: "Automation", press: function () { window.location.href = "/dashboard/webapp/index.html"; },
                            tileContent: new TileContent({ content: new NumericContent({ value: "68", scale: "%", icon: "sap-icon://accept", valueColor: "Good" }) })
                        }).setLayoutData(new GridContainerItemLayoutData({ columns: 2, rows: 2 })),

                        new GenericTile({
                            header: "Avg. Latency", subheader: "Performance", press: function () { window.location.href = "/dashboard/webapp/index.html"; },
                            tileContent: new TileContent({ content: new NumericContent({ value: "145", scale: "ms", icon: "sap-icon://speed-boat", valueColor: "Neutral" }) })
                        }).setLayoutData(new GridContainerItemLayoutData({ columns: 2, rows: 2 })),

                        new GenericTile({
                            header: "AI Models", subheader: "Active Providers", press: function () { window.location.href = "/admin/webapp/index.html"; },
                            tileContent: new TileContent({ content: new NumericContent({ value: "4", icon: "sap-icon://machine-learning", valueColor: "Critical" }) })
                        }).setLayoutData(new GridContainerItemLayoutData({ columns: 2, rows: 2 }))
                    ]
                });

                // 3. APPS: Grid Container
                var oGridApps = new GridContainer({
                    layout: new GridContainerSettings({ rowSize: "84px", columnSize: "84px", gap: "16px" }),
                    items: [
                        // Primary App: Dashboard
                        new GenericTile({
                            header: "Executive Dashboard", subheader: "Full Analytics & Reports", frameType: "TwoByOne",
                            press: function () { window.location.href = "/dashboard/webapp/index.html"; },
                            tileContent: new TileContent({ content: new ImageContent({ src: "sap-icon://bbyd-dashboard" }) })
                        }).setLayoutData(new GridContainerItemLayoutData({ columns: 4, rows: 2 })),

                        // Core Apps
                        new GenericTile({
                            header: "Scenarios", subheader: "Manage Logic",
                            press: function () { window.location.href = "/scenarios/webapp/index.html"; },
                            tileContent: new TileContent({ content: new ImageContent({ src: "sap-icon://org-chart" }) })
                        }).setLayoutData(new GridContainerItemLayoutData({ columns: 2, rows: 2 })),

                        new GenericTile({
                            header: "Rules", subheader: "Business Policies",
                            press: function () { window.location.href = "/rules/webapp/index.html"; },
                            tileContent: new TileContent({ content: new ImageContent({ src: "sap-icon://process" }) })
                        }).setLayoutData(new GridContainerItemLayoutData({ columns: 2, rows: 2 })),

                        new GenericTile({
                            header: "Execute", subheader: "Simulation",
                            press: function () { window.location.href = "/execute/webapp/index.html"; },
                            tileContent: new TileContent({ content: new ImageContent({ src: "sap-icon://media-play" }) })
                        }).setLayoutData(new GridContainerItemLayoutData({ columns: 2, rows: 2 })),

                        new GenericTile({
                            header: "History", subheader: "Audit Trail",
                            press: function () { window.location.href = "/history/webapp/index.html"; },
                            tileContent: new TileContent({ content: new ImageContent({ src: "sap-icon://history" }) })
                        }).setLayoutData(new GridContainerItemLayoutData({ columns: 2, rows: 2 })),

                        new GenericTile({
                            header: "Admin", subheader: "Configuration",
                            press: function () { window.location.href = "/admin/webapp/index.html"; },
                            tileContent: new TileContent({ content: new ImageContent({ src: "sap-icon://action-settings" }) })
                        }).setLayoutData(new GridContainerItemLayoutData({ columns: 2, rows: 2 }))
                    ]
                });

                // 4. QUICK ACTIONS
                var oQuickActions = new HBox({
                    wrap: "Wrap",
                    items: [
                        new Button({ text: "New Scenario", icon: "sap-icon://add", type: "Emphasized", press: function () { window.location.href = "/scenarios/webapp/index.html"; } }).addStyleClass("sapUiSmallMarginEnd"),
                        new Button({ text: "Simulate Decision", icon: "sap-icon://simulate", press: function () { window.location.href = "/execute/webapp/index.html"; } }).addStyleClass("sapUiSmallMarginEnd"),
                        new Button({ text: "View Logs", icon: "sap-icon://log", press: function () { window.location.href = "/history/webapp/index.html"; } })
                    ]
                }).addStyleClass("sapUiMediumMarginTop sapUiMediumMarginBottom");


                // MAIN PAGE STRUCTURE
                var oPage = new Page({
                    showHeader: false,
                    enableScrolling: true,
                    content: [
                        new ToolHeader({
                            content: [
                                new Button({ icon: "sap-icon://menu2", type: "Transparent" }),
                                new Image({ src: "https://unpkg.com/@sap/ux-icons-font@1.0.0/dist/SAP-icons/decision.svg", height: "24px" }),
                                new Title({ text: "DecisionCore AI", titleStyle: "H5" }).addStyleClass("sapUiTinyMarginBegin"),
                                new ToolbarSpacer(),
                                new Button({ icon: "sap-icon://search", type: "Transparent" }),
                                new Button({ icon: "sap-icon://bell", type: "Transparent" }),
                                new Avatar({ initials: "TK", displaySize: "XS", backgroundColor: "Accent6" }).addStyleClass("sapUiTinyMarginBegin")
                            ]
                        }),
                        oHeroLayout,

                        new VBox({
                            items: [
                                new Title({ text: "Key Metrics", titleStyle: "H3", showLayout: true }),
                                oGridKPI,

                                new Title({ text: "Applications", titleStyle: "H3", showLayout: true }).addStyleClass("sapUiLargeMarginTop"),
                                oGridApps,

                                new Title({ text: "Quick Actions", titleStyle: "H3", showLayout: true }).addStyleClass("sapUiLargeMarginTop"),
                                oQuickActions
                            ]
                        }).addStyleClass("content-padding")
                    ],
                    footer: new Bar({
                        contentMiddle: [
                            new Text({ text: "© 2026 DecisionCore AI • Enterprise Logic Engine • Created by Taha Khattari" })
                        ]
                    })
                });

                new sap.m.App({ pages: [oPage] }).placeAt("content");
            });
        });
    </script>
</head>

<body class="sapUiBody" id="content"></body>

</html>
