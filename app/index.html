<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>DecisionCore AI - Enterprise Platform</title>
    <script id="sap-ui-bootstrap" src="https://sapui5.hana.ondemand.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon" data-sap-ui-libs="sap.m,sap.f,sap.ui.layout,sap.tnt,sap.ui.unified"
        data-sap-ui-compatVersion="edge" data-sap-ui-async="true" data-sap-ui-preload="async"
        data-sap-ui-resourceroots='{"decisioncore.launchpad": "./"}'>
        </script>

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        .sapMPageEnableScrolling {
            height: 100%;
        }

        /* App IFrame styling */
        #appFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Hero styling reused */
        .hero-section {
            padding: 3rem 4rem 2rem 4rem;
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .hero-title .sapMTitle {
            font-size: 2.5rem !important;
            font-weight: 700 !important;
            color: #1d2d3e;
        }

        .content-padding {
            padding: 2rem 4rem;
        }
    </style>

    <script>
        window.addEventListener("message", function (event) {
            if (event.data && event.data.type === "setTheme") {
                sap.ui.getCore().applyTheme(event.data.theme);
            }
        });

        sap.ui.getCore().attachInit(function () {
            // Restore Theme
            var sStoredTheme = localStorage.getItem("ui5-theme");
            if (sStoredTheme) {
                sap.ui.getCore().applyTheme(sStoredTheme);
            }

            sap.ui.require([
                "sap/tnt/ToolPage",
                "sap/tnt/ToolHeader",
                "sap/tnt/SideNavigation",
                "sap/tnt/NavigationList",
                "sap/tnt/NavigationListItem",
                "sap/m/Image",
                "sap/m/Title",
                "sap/m/Button",
                "sap/m/Avatar",
                "sap/m/ToolbarSpacer",
                "sap/f/GridContainer",
                "sap/f/GridContainerSettings",
                "sap/f/GridContainerItemLayoutData",
                "sap/m/GenericTile",
                "sap/m/TileContent",
                "sap/m/NumericContent",
                "sap/m/ImageContent",
                "sap/m/VBox",
                "sap/m/Bar",
                "sap/m/Text",
                "sap/ui/core/HTML"
            ], function (ToolPage, ToolHeader, SideNavigation, NavigationList, NavigationListItem, Image, Title, Button, Avatar, ToolbarSpacer, GridContainer, GridContainerSettings, GridContainerItemLayoutData, GenericTile, TileContent, NumericContent, ImageContent, VBox, Bar, Text, HTML) {

                // --- HOME DASHBOARD CONTENT (The Grid) ---
                var oGridKPI = new GridContainer({
                    layout: new GridContainerSettings({ rowSize: "84px", columnSize: "84px", gap: "16px" }),
                    items: [
                        new GenericTile({
                            header: "Decisions", subheader: "Today",
                            press: function () { navigateTo("dashboard", "/dashboard/webapp/index.html"); },
                            tileContent: new TileContent({ content: new NumericContent({ value: "12.5k", icon: "sap-icon://line-chart", valueColor: "Good" }) })
                        }).setLayoutData(new GridContainerItemLayoutData({ columns: 2, rows: 2 })),

                        new GenericTile({
                            header: "Approval Rate", subheader: "Automated",
                            press: function () { navigateTo("dashboard", "/dashboard/webapp/index.html"); },
                            tileContent: new TileContent({ content: new NumericContent({ value: "68", scale: "%", icon: "sap-icon://accept", valueColor: "Good" }) })
                        }).setLayoutData(new GridContainerItemLayoutData({ columns: 2, rows: 2 })),

                        new GenericTile({
                            header: "Latency", subheader: "Avg Response",
                            press: function () { navigateTo("dashboard", "/dashboard/webapp/index.html"); },
                            tileContent: new TileContent({ content: new NumericContent({ value: "145", scale: "ms", icon: "sap-icon://speed-boat", valueColor: "Neutral" }) })
                        }).setLayoutData(new GridContainerItemLayoutData({ columns: 2, rows: 2 }))
                    ]
                });

                var oHero = new VBox({
                    items: [
                        new Title({ text: "Good Morning, Taha", level: "H1" }).addStyleClass("hero-title"),
                        oGridKPI
                    ]
                }).addStyleClass("hero-section");

                // Footer Bar
                var oFooter = new Bar({
                    contentMiddle: [
                        new Text({ text: "© 2026 DecisionCore AI • Enterprise Logic Engine • Created by Taha Khattari" })
                    ]
                });

                // MAIN CONTAINER
                var oMainContainer = new sap.m.Page({
                    showHeader: false,
                    content: [oHero],
                    footer: oFooter,
                    showFooter: true
                });

                // Helper to select item safely
                function selectSideItem(sKey) {
                    var oList = oSideNav.getItem();
                    var aItems = oList.getItems();
                    for (var i = 0; i < aItems.length; i++) {
                        if (aItems[i].getKey() === sKey) {
                            oList.setSelectedItem(aItems[i]);
                            return;
                        }
                    }
                }

                // Function to switch view
                function navigateTo(sKey, sUrl) {
                    selectSideItem(sKey);

                    if (sKey === "home") {
                        oMainContainer.removeAllContent();
                        oMainContainer.addContent(oHero);
                        oMainContainer.setShowFooter(true);
                        oMainContainer.setEnableScrolling(true);
                    } else {
                        // Load App in IFrame
                        var sFrameHtml = "<iframe id='appFrame' src='" + sUrl + "'></iframe>";
                        var oHtmlControl = new HTML({ content: sFrameHtml });

                        oMainContainer.removeAllContent();
                        oMainContainer.addContent(oHtmlControl);
                        oMainContainer.setShowFooter(false);
                        oMainContainer.setEnableScrolling(false);
                    }
                }

                // --- SIDE NAVIGATION ---
                var oSideNav = new SideNavigation({
                    item: new NavigationList({
                        items: [
                            new NavigationListItem({ text: "Home", icon: "sap-icon://home", key: "home" }),
                            new NavigationListItem({ text: "Dashboard", icon: "sap-icon://bbyd-dashboard", key: "dashboard" }), // NEW
                            new NavigationListItem({ text: "Scenarios", icon: "sap-icon://org-chart", key: "scenarios" }),
                            new NavigationListItem({ text: "Rules", icon: "sap-icon://process", key: "rules" }),
                            new NavigationListItem({ text: "Simulate", icon: "sap-icon://media-play", key: "execute" }),
                            new NavigationListItem({ text: "History", icon: "sap-icon://history", key: "history" }),
                            new NavigationListItem({ text: "Admin", icon: "sap-icon://action-settings", key: "admin" })
                        ]
                    }),
                    itemSelect: function (oEvent) {
                        var sKey = oEvent.getParameter("item").getKey();
                        var sUrl = "";
                        switch (sKey) {
                            case "home": sUrl = ""; break;
                            case "dashboard": sUrl = "/dashboard/webapp/index.html"; break;
                            case "scenarios": sUrl = "/scenarios/webapp/index.html"; break;
                            case "rules": sUrl = "/rules/webapp/index.html"; break;
                            case "execute": sUrl = "/execute/webapp/index.html"; break;
                            case "history": sUrl = "/history/webapp/index.html"; break;
                            case "admin": sUrl = "/admin/webapp/index.html"; break;
                        }
                        navigateTo(sKey, sUrl);
                    }
                });

                // --- TOOL HEADER ---
                var oToolHeader = new ToolHeader({
                    content: [
                        new Button({
                            icon: "sap-icon://menu2",
                            type: "Transparent",
                            press: function () { oSideNav.setExpanded(!oSideNav.getExpanded()); }
                        }),
                        new Image({ src: "https://unpkg.com/@sap/ux-icons-font@1.0.0/dist/SAP-icons/decision.svg", height: "24px" }),
                        new Title({ text: "DecisionCore AI", level: "H3" }).addStyleClass("sapUiSmallMarginBegin"),
                        new ToolbarSpacer(),
                        new Button({
                            icon: "sap-icon://search",
                            type: "Transparent",
                            press: function () {
                                sap.ui.require(["sap/m/SelectDialog", "sap/m/StandardListItem"], function (SelectDialog, StandardListItem) {
                                    if (!window._oSearchDialog) {
                                        window._oSearchDialog = new SelectDialog({
                                            title: "Global Search",
                                            placeholder: "Search Scenarios, Rules...",
                                            search: function (oEvent) {
                                                var sValue = oEvent.getParameter("value");
                                                if (sValue) {
                                                    oEvent.getSource().destroyItems();
                                                    oEvent.getSource().addItem(new StandardListItem({ title: "Scenario: " + sValue, description: "Go to Scenarios", type: "Active", icon: "sap-icon://org-chart" }));
                                                    oEvent.getSource().addItem(new StandardListItem({ title: "Rule: " + sValue, description: "Go to Rules", type: "Active", icon: "sap-icon://process" }));
                                                }
                                            },
                                            confirm: function (oEvent) {
                                                var oItem = oEvent.getParameter("selectedItem");
                                                if (oItem) {
                                                    var sTitle = oItem.getTitle();
                                                    if (sTitle.startsWith("Scenario")) navigateTo("scenarios", "/scenarios/webapp/index.html");
                                                    else if (sTitle.startsWith("Rule")) navigateTo("rules", "/rules/webapp/index.html");
                                                }
                                            }
                                        });
                                    }
                                    window._oSearchDialog.open();
                                });
                            }
                        }),
                        new Button({
                            icon: "sap-icon://palette",
                            type: "Transparent",
                            tooltip: "Toggle Theme",
                            press: function () {
                                var sCurrent = sap.ui.getCore().getConfiguration().getTheme();
                                var bIsDark = sCurrent.includes("dark");
                                var sNew = bIsDark ? "sap_horizon" : "sap_horizon_dark";

                                // Apply and Persist
                                sap.ui.getCore().applyTheme(sNew);
                                localStorage.setItem("ui5-theme", sNew); // Persist

                                // Broadcast to frames
                                var fs = document.getElementsByTagName("iframe");
                                for (var i = 0; i < fs.length; i++) {
                                    fs[i].contentWindow.postMessage({ type: "setTheme", theme: sNew }, "*");
                                }
                            }
                        }),
                        new Button({
                            icon: "sap-icon://bell",
                            type: "Transparent",
                            press: function () { sap.m.MessageToast.show("No new notifications"); }
                        }),
                        new Avatar({ initials: "TK", displaySize: "XS", press: function () { sap.m.MessageToast.show("Profile: Taha Khattari (Admin)"); } }).addStyleClass("sapUiSmallMarginBegin")
                    ]
                });

                // --- ROOT LAYOUT (ToolPage) ---
                var oToolPage = new ToolPage({
                    header: oToolHeader,
                    sideContent: oSideNav,
                    mainContents: [oMainContainer]
                });

                oToolPage.placeAt("content");
            });
        });
    </script>
</head>

<body class="sapUiBody" id="content"></body>

</html>
