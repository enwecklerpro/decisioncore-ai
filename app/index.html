<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DecisionCore AI - Launchpad</title>

    <script id="sap-ui-bootstrap" src="https://sapui5.hana.ondemand.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon" data-sap-ui-libs="sap.m, sap.f, sap.ui.layout" data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true">
        </script>

    <script>
        sap.ui.getCore().attachInit(function () {
            sap.ui.require([
                "sap/m/Shell",
                "sap/f/ShellBar",
                "sap/f/GridContainer",
                "sap/m/GenericTile",
                "sap/m/TileContent",
                "sap/m/NumericContent",
                "sap/m/ImageContent",
                "sap/ui/layout/cssgrid/GridBoxLayout",
                "sap/m/Page",
                "sap/m/Title",
                "sap/m/Avatar"
            ], function (Shell, ShellBar, GridContainer, GenericTile, TileContent, NumericContent, ImageContent, GridBoxLayout, Page, Title, Avatar) {

                // Shell Bar
                var oShellBar = new ShellBar({
                    title: "DecisionCore AI",
                    secondTitle: "Enterprise Platform",
                    homeIcon: "sap-icon://decision",
                    profile: new Avatar({ initials: "EP" })
                });

                // Grid Container
                var oGrid = new GridContainer({
                    layout: new GridBoxLayout({ boxMinWidth: "17rem" }),
                    snapToRow: true
                });

                // Helper to create tile
                function createTile(title, sub, icon, url, val, scale, color) {
                    var oTileContent;
                    if (val) {
                        oTileContent = new TileContent({
                            content: new NumericContent({ value: val, scale: scale, icon: icon, valueColor: color || "Neutral" })
                        });
                    } else {
                        oTileContent = new TileContent({
                            content: new ImageContent({ src: icon })
                        });
                    }

                    return new GenericTile({
                        header: title,
                        subheader: sub,
                        tileContent: [oTileContent],
                        press: function () {
                            if (url) window.location.href = url;
                        }
                    }).addStyleClass("sapUiTinyMargin");
                }

                // Add Tiles
                oGrid.addItem(createTile("Total Decisions", "All time", "sap-icon://line-charts", "/dashboard/webapp/index.html", "12.5k", "", "Good"));
                oGrid.addItem(createTile("Approval Rate", "Automation", "sap-icon://accept", "/dashboard/webapp/index.html", "68", "%", "Good"));

                oGrid.addItem(createTile("Executive Dashboard", "Analytics", "sap-icon://bbyd-dashboard", "/dashboard/webapp/index.html"));
                oGrid.addItem(createTile("Scenario Management", "Definitions", "sap-icon://org-chart", "/scenarios/webapp/index.html"));
                oGrid.addItem(createTile("Rules Management", "Policies", "sap-icon://user-settings", "/rules/webapp/index.html"));
                oGrid.addItem(createTile("Decision Execution", "Simulation", "sap-icon://media-play", "/execute/webapp/index.html"));
                oGrid.addItem(createTile("Decision History", "Audit Logs", "sap-icon://history", "/history/webapp/index.html"));
                oGrid.addItem(createTile("Administration", "Settings", "sap-icon://action-settings", "/admin/webapp/index.html"));

                // Page
                var oPage = new Page({
                    showHeader: false,
                    content: [
                        oShellBar,
                        new Title({ text: "My Applications", titleStyle: "H3" }).addStyleClass("sapUiMediumMarginTop sapUiMediumMarginBegin"),
                        oGrid
                    ]
                });

                // App Shell
                new Shell({
                    app: oPage,
                    appWidthLimited: false
                }).placeAt("content");
            });
        });
    </script>
</head>

<body class="sapUiBody" id="content">
</body>

</html>
