<!DOCTYPE html>
<html style="background-color:#12171c">

<head>
    <meta charset="utf-8">
    <title>Rules Management</title>
    <script>
        (function () {
            var sTheme = localStorage.getItem("ui5-theme") || "sap_horizon";
            var isDark = sTheme.indexOf("dark") !== -1;
            var bgColor = isDark ? "#12171c" : "#ffffff";
            document.documentElement.style.backgroundColor = bgColor;
            document.documentElement.style.colorScheme = isDark ? "dark" : "light";
            window["sap-ui-config"] = { theme: sTheme };
        })();
    </script>
    <style>
        html,
        body,
        .sapUiBody,
        .sapMPage,
        .sapFDynamicPage {
            background-color: inherit !important;
            transition: none !important;
        }
    </style>
    <script>
        window.addEventListener("message", function (event) {
            if (event.data && event.data.type === "setTheme") {
                var apply = function () {
                    if (window.sap && sap.ui && sap.ui.getCore && sap.ui.getCore().applyTheme) {
                        sap.ui.getCore().applyTheme(event.data.theme);
                        var isDark = event.data.theme.indexOf("dark") !== -1;
                        document.documentElement.style.backgroundColor = isDark ? "#12171c" : "#ffffff";
                    } else {
                        setTimeout(apply, 50);
                    }
                };
                apply();
            }
        });
    </script>
    <script id="sap-ui-bootstrap" src="https://sapui5.hana.ondemand.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon" data-sap-ui-libs="sap.m, sap.f, sap.ui.layout, sap.ui.table"
        data-sap-ui-compatVersion="edge" data-sap-ui-async="true"
        data-sap-ui-resourceroots='{"decisioncore.rules": "./"}' data-sap-ui-xx-componentPreload="off"
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport">
        </script>
</head>

<body class="sapUiBody">
    <div data-sap-ui-component data-name="decisioncore.rules" data-id="container"></div>
</body>

</html>
